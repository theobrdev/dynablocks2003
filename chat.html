<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat - DynaBlocks</title>

</head>
<body>
<div id="page">

  <div id="logo">
    <a href="index.html"><img src="img/logo.png" width="282" height="34" alt="DynaBlocks Beta"></a>
  </div>

  <div id="chat-win">
    <div class="cw-title"><span>DynaBlocks Chat</span></div>
    <div class="cw-body">
      <div class="cw-main">
        <div class="cw-with" id="cw-with">Select a friend to chat</div>
        <div class="cw-msgs" id="cw-msgs"></div>
        <div class="cw-send">
          <input id="cw-input" maxlength="500" placeholder="Type a message..." disabled>
          <button id="cw-send" disabled>Send</button>
        </div>
      </div>
      <div class="cw-side">
        <div class="cw-with">Friends</div>
        <ul id="cw-friends"></ul>
        <div class="cw-add">
          <input id="cw-add-name" placeholder="Username" maxlength="20">
          <button id="cw-add-btn">Add friend</button>
          <div id="cw-note"></div>
        </div>
      </div>
    </div>
  </div>
  <p class="chat-back"><a href="index.html">&laquo; Back to the home page</a></p>
