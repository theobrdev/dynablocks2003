<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - DynaBlocks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page">

  <div id="logo">
    <a href="index.html"><img src="img/logo.png" width="282" height="34" alt="DynaBlocks Beta"></a>
  </div>

  <div id="auth">
    <h1 class="head big" style="text-decoration:none">Give points</h1>

    <label for="a-user">Username:</label>
    <input type="text" id="a-user" maxlength="20">

    <label for="a-amount">Points (negative to take away):</label>
    <input type="number" id="a-amount" value="50">

    <label for="a-reason">Reason:</label>
    <input type="text" id="a-reason" maxlength="100" placeholder="e.g. Won the model contest">

    <div class="buttons"><button type="button" id="a-go">Give points</button></div>
    <p id="msg"></p>
    <p><a href="index.html">&laquo; Back to the home page</a></p>
  </div>

  <div id="pending">
    <h2 class="head">Pending assets</h2>
    <div class="agrid" id="pending-grid">Loading...</div>
  </div>

  <div id="pending-models" style="width:680px;max-width:96vw;margin:10px auto 30px;font-size:13px">
    <h2 class="head">Pending models (Toolbox)</h2>
    <div id="pm-list">Loading...</div>
  </div>

  <div id="accounts" style="width:960px;max-width:96vw;margin:10px auto 30px;font-size:12px">
    <h2 class="head">Accounts</h2>
    <p>
      <input type="text" id="acc-search" placeholder="Search username or e-mail" style="width:240px">
      <button type="button" id="acc-refresh">Refresh</button>
    </p>
    <p id="acc-msg"></p>
    <div id="accounts-body" style="overflow-x:auto">Loading...</div>
  </div>

  <div id="footer">
    <div class="copy">Copyright 2003 DYNABLOCKS, Inc. &nbsp;Patents pending</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://szwirufpcohmizxvrzjq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_z_FQh2IHQ_I9h-sGmRCOvw_sHmtTFcx';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const say = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'err'; };

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) e[k] = props[k];
    kids.forEach(k => e.append(k));
    return e;
  }

  async function loadPending() {
    const grid = $('pending-grid');
    const { data, error } = await db.from('assets')
      .select('id, name, path, created_at, profiles(username)')
      .eq('approved', false).order('created_at', { ascending: true });
    grid.innerHTML = '';
    if (error) { grid.textContent = error.message; return; }
    if (!data.length) { grid.textContent = 'Nothing waiting for approval.'; return; }

    data.forEach(a => {
      const url = db.storage.from('assets').getPublicUrl(a.path).data.publicUrl;
      const by = (a.profiles && a.profiles.username) || '?';
      const yes = el('button', { textContent: 'Yes, approve', type: 'button' });
      const no  = el('button', { textContent: 'No, reject', type: 'button' });

      yes.onclick = async () => {
        const { data: ok, error: e } = await db.from('assets').update({ approved: true }).eq('id', a.id).select();
        if (e || !ok.length) return alert(e ? e.message : 'Not allowed (are you the admin?).');
        loadPending();
      };
      no.onclick = async () => {
        if (!confirm('Reject and delete "' + a.name + '"?')) return;
        const { data: gone, error: e } = await db.from('assets').delete().eq('id', a.id).select();
        if (e || !gone.length) return alert(e ? e.message : 'Not allowed (are you the admin?).');
        await db.storage.from('assets').remove([a.path]);
        loadPending();
      };

      grid.append(el('div', { className: 'acard' },
        el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' },
          el('img', { src: url, alt: a.name })),
        el('div', { className: 'aname', textContent: a.name }),
        el('small', { textContent: 'by ' + by }),
        el('div', null, yes), el('div', null, no)));
    });
  }

  // ---------- Accounts: deletar, banir, desbanir, dar/tirar admin ----------
  let allUsers = [], myId = null;
  const accMsg = (t, ok) => { $('acc-msg').textContent = t; $('acc-msg').className = ok ? 'ok' : 'err'; };
  const day = iso => (iso ? new Date(iso).toLocaleDateString() : '-');

  async function loadUsers() {
    const { data, error } = await db.rpc('admin_list_users');
    if (error) { $('accounts-body').textContent = error.message; return; }
    allUsers = data || [];
    renderUsers();
  }
  async function callAdmin(fn, args) {
    const { data, error } = await db.rpc(fn, args);
    if (error) { alert(error.message); return false; }
    accMsg(data, true);
    await loadUsers();
    return true;
  }
  function act(label, fn) {
    const a = el('a', { href: '#', textContent: label });
    a.style.marginRight = '10px';
    a.onclick = e => { e.preventDefault(); fn(); };
    return a;
  }

  function renderUsers() {
    const q = $('acc-search').value.trim().toLowerCase();
    const list = allUsers.filter(u =>
      !q || (u.username || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
    const t = el('table', { className: 'mygb-table' });
    t.append(el('tr', null, ...['ID', 'Username', 'E-mail', 'Points', 'Role', 'Status', 'Joined', 'Last sign-in', 'Actions']
      .map(x => el('th', { textContent: x }))));

    list.forEach(u => {
      const name = u.username || '(no profile)';
      const actions = el('td');
      if (u.id === myId) {
        actions.append(document.createTextNode('(you)'));
      } else {
        if (u.is_admin) {
          actions.append(act('remove admin', () => {
            if (confirm('Remove admin status from ' + name + '?')) callAdmin('admin_set_admin', { p_user: u.id, p_admin: false });
          }));
        } else {
          actions.append(act('make admin', () => {
            if (confirm('Make ' + name + ' an ADMIN? Admins can ban and delete accounts.')) callAdmin('admin_set_admin', { p_user: u.id, p_admin: true });
          }));
          if (u.banned) {
            actions.append(act('unban', () => {
              if (confirm('Unban ' + name + '?')) callAdmin('admin_set_ban', { p_user: u.id, p_banned: false });
            }));
          } else {
            actions.append(act('ban', () => {
              const reason = prompt('Ban ' + name + '?\nReason (optional, only you will see it):', '');
              if (reason === null) return;
              callAdmin('admin_set_ban', { p_user: u.id, p_banned: true, p_reason: reason });
            }));
          }
          actions.append(act('delete', async () => {
            const key = u.username || u.email || '';
            const typed = prompt('This PERMANENTLY deletes the account and all of its data.\nType "' + key + '" to confirm:');
            if (typed === null) return;
            if (typed.trim() !== key) { alert('That did not match. Nothing was deleted.'); return; }
            if (await callAdmin('admin_delete_user', { p_user: u.id })) {
              // apaga também as imagens enviadas por essa conta (pasta com o id dela)
              const { data: files } = await db.storage.from('assets').list(u.id, { limit: 1000 });
              if (files && files.length) await db.storage.from('assets').remove(files.map(f => u.id + '/' + f.name));
            }
          }));
        }
      }
      const status = u.banned ? 'Banned' + (u.ban_reason ? ' (' + u.ban_reason + ')' : '') : 'Active';
      const row = el('tr', null,
        el('td', { textContent: u.user_number == null ? '-' : u.user_number }),
        el('td', { textContent: name }),
        el('td', { textContent: u.email || '' }),
        el('td', { textContent: u.points }),
        el('td', { textContent: u.is_admin ? 'Admin' : 'User' }),
        el('td', { textContent: status }),
        el('td', { textContent: day(u.created_at) }),
        el('td', { textContent: day(u.last_sign_in_at) }),
        actions);
      if (u.banned) row.style.color = '#b00020';
      t.append(row);
    });
    $('accounts-body').innerHTML = '';
    $('accounts-body').append(t);
    if (!list.length) $('accounts-body').append(el('p', { textContent: 'No accounts match.' }));
  }
  $('acc-search').oninput = renderUsers;
  $('acc-refresh').onclick = loadUsers;

  // ---------- Modelos da Toolbox esperando aprovação ----------
  async function loadPendingModels() {
    const box = $('pm-list');
    const { data, error } = await db.from('toolbox_models')
      .select('id, name, description, owner_id, part_count, script_count, created_at')
      .eq('status', 'pending').order('created_at', { ascending: true });
    if (error) { box.textContent = error.message; return; }
    if (!data.length) { box.textContent = 'Nothing waiting for approval.'; return; }
    const ids = [...new Set(data.map(r => r.owner_id))], names = {};
    const { data: profs } = await db.from('profiles').select('id, username').in('id', ids);
    (profs || []).forEach(p => { names[p.id] = p.username; });

    const t = el('table', { className: 'mygb-table' });
    t.append(el('tr', null, ...['Model', 'By', 'Parts', 'Scripts', ''].map(x => el('th', { textContent: x }))));
    data.forEach(r => {
      const name = el('td', null, el('b', { textContent: r.name }));
      if (r.description) name.append(document.createElement('br'), el('small', { textContent: r.description }));
      const open = el('a', { href: 'editor.html?mode=model&model=' + r.id, target: '_blank', rel: 'noopener', textContent: 'Open in the editor' });
      const yes = el('button', { type: 'button', textContent: 'Approve' });
      const no = el('button', { type: 'button', textContent: 'Reject' });
      yes.onclick = async () => {
        const { data: ok, error: e } = await db.from('toolbox_models').update({ status: 'approved' }).eq('id', r.id).select();
        if (e || !ok.length) return alert(e ? e.message : 'Not allowed (are you the admin?).');
        loadPendingModels();
      };
      no.onclick = async () => {
        if (!confirm('Reject and delete "' + r.name + '"?')) return;
        const { data: gone, error: e } = await db.from('toolbox_models').delete().eq('id', r.id).select();
        if (e || !gone.length) return alert(e ? e.message : 'Not allowed (are you the admin?).');
        loadPendingModels();
      };
      const actions = el('td', null, open, document.createElement('br'), yes, document.createTextNode(' '), no);
      t.append(el('tr', null, name, el('td', { textContent: names[r.owner_id] || '?' }),
        el('td', { textContent: r.part_count }), el('td', { textContent: r.script_count }), actions));
    });
    box.innerHTML = '';
    box.append(t);
  }

  db.auth.getSession().then(({ data }) => {
    if (!data.session) { location.href = 'signin.html'; return; }
    myId = data.session.user.id;
    loadPending();
    loadPendingModels();
    loadUsers();
  });

  $('a-go').onclick = async () => {
    const { data, error } = await db.rpc('award_points', {
      p_username: $('a-user').value.trim(),
      p_amount: parseInt($('a-amount').value, 10),
      p_reason: $('a-reason').value.trim()
    });
    say(error ? error.message : data, !error);
  };
</script>
</body>
</html>
